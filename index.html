<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Web</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Le bouton qui recouvre tout l'écran */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            color: white;
            text-align: center;
        }

        #overlay h1 {
            border: 3px solid white;
            padding: 20px 40px;
            transition: 0.3s;
        }

        #overlay h1:hover {
            background: white;
            color: black;
        }

        /* On cache le lecteur au début */
        #player {
            display: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>ENTRER SUR LE SITE</h1>
        <p>Cliquez pour charger le contenu</p>
    </div>

    <div id="player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;

        // Cette fonction crée le lecteur YouTube
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '315',
                width: '560',
                videoId: 'oHg5SJYRHA0', // Ton ID Rick Roll
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1 // MODIF : Pour que ça marche sur iPhone sans passer en plein écran
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // Le lecteur est prêt
        }

        // Action au clic sur l'overlay
        document.getElementById('overlay').addEventListener('click', function() {
            // MODIF : On lance les commandes audio IMMÉDIATEMENT au clic pour iPhone
            if (player) {
                player.playVideo();
                player.unMute();
                player.setVolume(100);
            }

            this.style.display = 'none'; // Cache le bouton
            document.getElementById('player').style.display = 'block'; // Affiche la vidéo
        });
    </script>
</body>
</html>
